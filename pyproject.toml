[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weathercam"
version = "0.1.0"
description = "CCTV vehicle detection, attributes and text-to-image retrieval under adverse weather"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "psutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
